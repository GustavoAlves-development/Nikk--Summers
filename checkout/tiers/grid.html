<!doctype html>
<!-- Grade 2x2 de fotos bloqueadas (800x600) da página de upsell Fully Naked -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,800&family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 800px; height: 600px; overflow: hidden; background: #0d0609; font-family: Inter, sans-serif; }
  .art { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 800px; height: 600px; }
  .tile { position: relative; overflow: hidden; background: center 0 / 400px auto no-repeat; }
  .t1 { background-image: url(../../img/p4.png); background-position: center -100px; }
  .t2 { background-image: url(../../img/p2.png); background-position: center -80px; }
  .t3 { background-image: url(../../img/p1.png); background-position: center -260px; }
  .t4 { background-image: url(../../img/p6.png); background-position: center -260px; }
  .veil { position: absolute; left: 0; right: 0; bottom: 0; backdrop-filter: blur(30px) saturate(1.3); -webkit-backdrop-filter: blur(30px); }
  .t1 .veil { top: 196px; background: linear-gradient(180deg, rgba(255,140,90,.35), rgba(13,6,9,.55)); }
  .t2 .veil { top: 186px; background: linear-gradient(180deg, rgba(255,61,127,.35), rgba(13,6,9,.55)); }
  .t3 .veil, .t4 .veil { top: 0; background: linear-gradient(180deg, rgba(13,6,9,.35), rgba(255,61,127,.35)); }
  .lock { position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%); font-size: 46px; filter: drop-shadow(0 4px 14px rgba(0,0,0,.6)); }
  .ribbon {
    position: absolute; left: -20px; right: -20px; top: 50%; transform: translateY(-50%) rotate(-4deg); z-index: 3;
    background: linear-gradient(90deg, #c2185b, #ff3d7f 50%, #c2185b); padding: 14px 0 12px; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.6), 0 0 0 3px rgba(255,255,255,.15);
  }
  .ribbon .t { font: italic 800 64px/1 "Playfair Display", serif; color: #fff; text-shadow: 0 3px 0 #7a0f36; }
  .ribbon small { display: block; margin-top: 6px; font: 900 17px/1 Inter, sans-serif; letter-spacing: .14em; color: #fff; }
  .badge { position: absolute; top: 16px; left: 16px; z-index: 4; font: 900 20px/1 Inter, sans-serif; color: #fff; background: #ff3d7f; padding: 9px 12px; border-radius: 10px; }
</style></head>
<body><div class="art">
  <div class="tile t1"><div class="veil"></div></div>
  <div class="tile t2"><div class="veil"></div></div>
  <div class="tile t3"><div class="veil"></div><span class="lock">🔒</span></div>
  <div class="tile t4"><div class="veil"></div><span class="lock">🔒</span></div>
  <span class="badge">18+</span>
  <div class="ribbon"><span class="t">Fully Naked</span><small>🔓 TAP "YES" TO UNLOCK EVERYTHING</small></div>
</div></body></html>
