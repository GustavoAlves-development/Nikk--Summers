<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700;1,800&family=Inter:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 400px; overflow: hidden; background: #0d0609; }
  .art { position: relative; width: 1200px; height: 400px; display: flex; }
  .ph { width: 400px; height: 400px; background-size: cover; background-repeat: no-repeat; }
  .p9 { background-image: url(../img/p9.png); background-position: center 52%; }
  .p8 { background-image: url(../img/p8.png); background-position: center 55%; filter: brightness(1.3) contrast(1.05); }
  .p7 { background-image: url(../img/p7.png); background-position: center 48%; }
  .art::after {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 70% at 50% 60%, rgba(13,6,9,.25), transparent 70%),
      linear-gradient(180deg, transparent 35%, rgba(13,6,9,.6) 60%, rgba(13,6,9,.92) 100%),
      linear-gradient(90deg, rgba(255,61,127,.18), transparent 30%, transparent 70%, rgba(255,61,127,.18));
  }
  .strip {
    position: absolute; left: 0; right: 0; bottom: 36px; z-index: 2; text-align: center;
  }
  .t { font-family: "Playfair Display", serif; font-style: italic; line-height: 1; }
  .t .n { font-weight: 700; font-size: 64px; color: #fff; letter-spacing: .1em; margin-right: 14px; }
  .t .u {
    font-weight: 800; font-size: 84px; color: #ff3d7f;
    text-shadow: 0 0 28px rgba(255,61,127,.75), 0 4px 0 #7a0f36;
  }
  .sub {
    display: inline-block; margin-top: 14px; padding: 9px 22px; border-radius: 999px;
    font: 800 24px/1.1 Inter, sans-serif; color: #fff;
    background: rgba(255,61,127,.9); box-shadow: 0 6px 24px rgba(255,61,127,.55);
  }
  .badge {
    position: absolute; top: 18px; left: 18px; z-index: 2;
    font: 800 22px/1 Inter, sans-serif; color: #fff;
    background: #ff3d7f; padding: 9px 13px; border-radius: 10px;
  }
</style></head>
<body><div class="art">
  <div class="ph p9"></div><div class="ph p8"></div><div class="ph p7"></div>
  <span class="badge">18+</span>
  <div class="strip">
    <div class="t"><span class="n">NIKKI</span><span class="u">UNCENSORED</span></div>
    <div class="sub">You're 1 click away from seeing everything 🔥</div>
  </div>
</div></body></html>
