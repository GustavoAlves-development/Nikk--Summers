<!doctype html>
<!-- Template de criativo 1080x1350 (Meta feed 4:5). Parâmetros: img, y (offset px), s (largura da imagem px), p (início do painel px), h (headline), sub, layout=grid -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,800;1,800&family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #0d0609; font-family: Inter, sans-serif; }
  .art { position: relative; width: 1080px; height: 1350px; background: center 0 / 1080px auto no-repeat; }
  .grid { position: absolute; inset: 0 0 auto 0; display: flex; gap: 10px; height: 520px; }
  .grid div { flex: 1; background: center 0 / auto 1300px no-repeat; }
  .panel {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 56px 70px 64px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0d0609; text-align: center;
  }
  .panel::before {
    content: ""; position: absolute; left: 0; right: 0; top: -160px; height: 160px;
    background: linear-gradient(180deg, transparent, #0d0609);
  }
  .panel::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: linear-gradient(90deg, transparent, #ff3d7f, transparent); }
  h1 { font: 800 82px/1.08 "Playfair Display", serif; color: #fff; }
  h1 em { color: #ff3d7f; font-style: italic; }
  .sub { margin-top: 26px; font: 600 38px/1.35 Inter, sans-serif; color: #d9c3cc; }
  .cta {
    display: inline-block; margin-top: 40px; white-space: nowrap;
    font: 900 40px/1 Inter, sans-serif; color: #fff; background: #ff3d7f; padding: 26px 46px; border-radius: 999px;
    box-shadow: 0 14px 40px rgba(255,61,127,.55);
  }
  .tag {
    position: absolute; top: 48px; left: 48px; font: 900 30px/1 Inter, sans-serif; color: #fff;
    background: rgba(13,6,9,.65); border: 2px solid rgba(255,255,255,.35); padding: 16px 24px; border-radius: 999px;
    backdrop-filter: blur(8px);
  }
</style></head>
<body><div class="art" id="a">
  <span class="tag" id="tag"></span>
  <div class="panel" id="p"><h1 id="h"></h1><p class="sub" id="s"></p><span class="cta">Tap "Learn More" 👇</span></div>
</div>
<script>
  var q = new URLSearchParams(location.search), $ = function (id) { return document.getElementById(id); };
  if (q.get("layout") === "grid") {
    var g = document.createElement("div"); g.className = "grid";
    q.get("imgs").split(",").forEach(function (src, i) {
      var d = document.createElement("div");
      d.style.backgroundImage = "url(../img/" + src + ")";
      d.style.backgroundPosition = "center " + q.get("ys").split(",")[i] + "px";
      g.appendChild(d);
    });
    $("a").prepend(g);
  } else {
    $("a").style.backgroundImage = "url(../img/" + q.get("img") + ")";
    $("a").style.backgroundSize = (q.get("s") || 1080) + "px auto";
    $("a").style.backgroundPosition = "center " + q.get("y") + "px";
  }
  $("p").style.top = q.get("p") + "px";
  $("h").innerHTML = q.get("h");
  $("s").textContent = q.get("sub");
  if (q.get("fs")) $("h").style.fontSize = q.get("fs") + "px";
  if (q.get("tag")) $("tag").textContent = q.get("tag"); else $("tag").remove();
</script></body></html>
