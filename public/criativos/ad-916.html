<!doctype html>
<!-- Criativo 1080x1920 (9:16) que serve para feed E Reels/Stories.
     Zona segura: no feed a Meta corta 285px em cima e embaixo (fica 4:5); no Reels os ~35% de baixo ficam sob a legenda e o "Saiba mais".
     Por isso: rosto entre 285 e 840, texto entre 860 e 1250, seta entre 1290 e 1620.
     Parâmetros: img, y (offset px), s (largura da imagem px), h (headline), sub, c (texto do botão), tag, layout=grid + imgs + ys -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,800;1,800&family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0d0609; font-family: Inter, sans-serif; }
  .art { position: relative; width: 1080px; height: 1920px; background: center 0 / 1080px auto no-repeat; }
  .bgblur { position: absolute; inset: 0 0 auto 0; height: 860px; background: center / cover no-repeat; filter: blur(40px) brightness(.55); transform: scale(1.1); }
  .grid { position: absolute; left: 0; right: 0; top: 200px; display: flex; gap: 10px; height: 660px; }
  .grid div { flex: 1; background: center 0 / auto 1300px no-repeat; }
  .panel { position: absolute; left: 0; right: 0; top: 840px; bottom: 0; background: #0d0609; text-align: center; padding: 50px 60px 0; }
  .panel::before { content: ""; position: absolute; left: 0; right: 0; top: -200px; height: 200px; background: linear-gradient(180deg, transparent, #0d0609); }
  .panel::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: linear-gradient(90deg, transparent, #ff3d7f, transparent); }
  h1 { font: 800 84px/1.06 "Playfair Display", serif; color: #fff; }
  h1 em { color: #ff3d7f; font-style: italic; }
  .sub { margin-top: 20px; font: 600 38px/1.3 Inter, sans-serif; color: #d9c3cc; }
  .cta {
    display: inline-block; margin-top: 30px; white-space: nowrap;
    font: 900 38px/1 Inter, sans-serif; color: #fff; background: #ff3d7f; padding: 24px 42px; border-radius: 999px;
    box-shadow: 0 14px 40px rgba(255,61,127,.55);
  }
  .arrow-down { position: absolute; left: 0; right: 0; top: 1300px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .arrow-down span { font: 900 32px/1 Inter, sans-serif; letter-spacing: .12em; color: #ff7aa8; }
  .arrow-down i { width: 0; height: 0; border-left: 80px solid transparent; border-right: 80px solid transparent; border-top: 70px solid #ff3d7f; filter: drop-shadow(0 0 22px rgba(255,61,127,.75)); }
  .arrow-down i + i { margin-top: -30px; opacity: .55; }
  .tag {
    position: absolute; top: 320px; left: 48px; font: 900 30px/1 Inter, sans-serif; color: #fff;
    background: rgba(13,6,9,.65); border: 2px solid rgba(255,255,255,.35); padding: 16px 24px; border-radius: 999px;
  }
</style></head>
<body><div class="art" id="a">
  <span class="tag" id="tag"></span>
  <div class="panel"><h1 id="h"></h1><p class="sub" id="s"></p><span class="cta" id="c">Tap “Learn More”</span></div>
  <div class="arrow-down"><span>TAP RIGHT BELOW</span><i></i><i></i></div>
</div>
<script>
  var q = new URLSearchParams(location.search), $ = function (id) { return document.getElementById(id); };
  if (q.get("layout") === "grid") {
    var g = document.createElement("div"); g.className = "grid";
    q.get("imgs").split(",").forEach(function (src, i) {
      var d = document.createElement("div");
      d.style.backgroundImage = "url(../img/" + src + ")";
      d.style.backgroundPosition = "center " + q.get("ys").split(",")[i] + "px";
      g.appendChild(d);
    });
    $("a").prepend(g);
  } else {
    // foto principal numa camada própria (fica acima do fundo desfocado, abaixo do texto)
    var ph = document.createElement("div"), sz = q.get("s") || 1080;
    ph.style.cssText = "position:absolute;inset:0;background:url(../img/" + q.get("img") + ") center " + q.get("y") + "px / " + sz + "px auto no-repeat";
    $("a").prepend(ph);
    if (sz < 1080) { // imagem menor que a largura: preenche as laterais com a própria foto desfocada
      var bl = document.createElement("div"); bl.className = "bgblur"; bl.style.backgroundImage = "url(../img/" + q.get("img") + ")";
      $("a").prepend(bl);
    }
  }
  $("h").innerHTML = q.get("h");
  $("s").textContent = q.get("sub");
  if (q.get("c")) $("c").textContent = q.get("c");
  if (q.get("tag")) $("tag").textContent = q.get("tag"); else $("tag").remove();
</script></body></html>
